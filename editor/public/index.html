<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VZG Consult – Visueller Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/grapesjs@0.23.6/dist/css/grapes.min.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: Inter, system-ui, sans-serif; }
        #topbar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            height: 52px; padding: 0 12px; background: #0f2b46; color: #fff;
            border-bottom: 1px solid #0a1f33;
        }
        #topbar .brand { font-weight: 700; margin-right: 8px; white-space: nowrap; }
        #topbar .brand span { color: #7ec8a9; }
        #topbar select, #topbar button {
            height: 32px; border-radius: 6px; border: 1px solid #2b4a66;
            background: #16395a; color: #fff; padding: 0 10px; cursor: pointer; font-size: 13px;
        }
        #topbar button.primary { background: #1f9d6b; border-color: #1f9d6b; font-weight: 600; }
        #topbar button:hover { filter: brightness(1.15); }
        #topbar .spacer { flex: 1; }
        #topbar .status { font-size: 12px; opacity: .85; }
        #topbar a { color: #cfe3f3; font-size: 13px; text-decoration: none; }
        #gjs { height: calc(100% - 52px); }
        .gjs-one-bg { background-color: #f4f6f8; }
        .gjs-two-color { color: #0f2b46; }
    </style>
</head>
<body>
    <div id="topbar">
        <div class="brand">VZG <span>Editor</span></div>
        <label style="font-size:12px">Seite:</label>
        <select id="page-select"></select>
        <button id="btn-save" class="primary">💾 Speichern &amp; neu bauen</button>
        <button id="btn-undo" title="Rückgängig">↶</button>
        <button id="btn-redo" title="Wiederholen">↷</button>
        <button id="btn-preview" title="Vorschau">👁 Vorschau</button>
        <button id="btn-code" title="HTML/CSS anzeigen">&#123;&#125; Code</button>
        <button id="btn-reset" title="Auf Original zurücksetzen">↺ Original</button>
        <button id="btn-publish" title="Änderungen nach GitHub veröffentlichen" style="background:#2f6fed;border-color:#2f6fed;font-weight:600;">🚀 Veröffentlichen</button>
        <div class="spacer"></div>
        <span id="status" class="status">Bereit</span>
        <a href="/site/index.html" target="_blank">Live-Vorschau ↗</a>
    </div>

    <div id="gjs"></div>

    <div id="code-modal" style="display:none;position:fixed;inset:0;background:rgba(10,25,40,.6);z-index:9999;">
        <div style="position:absolute;inset:40px;background:#0f2b46;color:#dbe9f5;border-radius:10px;display:flex;flex-direction:column;">
            <div style="display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #2b4a66;">
                <strong style="color:#fff;">HTML / CSS</strong>
                <div style="flex:1"></div>
                <button id="code-close" style="height:30px;border-radius:6px;border:1px solid #2b4a66;background:#16395a;color:#fff;cursor:pointer;">Schließen</button>
            </div>
            <div style="display:flex;flex:1;gap:1px;overflow:hidden;">
                <textarea id="code-html" spellcheck="false" style="flex:2;border:0;background:#0b1f33;color:#cfe3f3;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:12px;resize:none;"></textarea>
                <textarea id="code-css" spellcheck="false" style="flex:1;border:0;background:#08182a;color:#cfe3f3;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:12px;resize:none;"></textarea>
            </div>
            <div style="padding:10px 14px;border-top:1px solid #2b4a66;">
                <button id="code-apply" class="primary" style="height:32px;border-radius:6px;border:1px solid #1f9d6b;background:#1f9d6b;color:#fff;font-weight:600;cursor:pointer;">HTML übernehmen</button>
                <span style="font-size:12px;opacity:.8;margin-left:8px;">CSS wird beim Speichern automatisch eingebunden.</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/grapesjs@0.23.6/dist/grapes.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/grapesjs-preset-webpage@1.0.3/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/grapesjs-blocks-basic@1.0.2/dist/index.js"></script>
    <script>
        const SITE = '/site/';
        const setStatus = (t) => (document.getElementById('status').textContent = t);

        // Relative Pfade (assets/, css/) im Canvas auf /site/ umbiegen.
        const toCanvas = (html) => html.replace(/(src|href)="(?!https?:|mailto:|tel:|#|\/)([^"]+)"/g, '$1="' + SITE + '$2"');
        const fromCanvas = (html) => html.split(SITE).join('');

        let currentSlug = null;
        let currentHead = '';
        let bodyScripts = [];

        const editor = grapesjs.init({
            container: '#gjs',
            height: '100%',
            storageManager: false,
            fromElement: false,
            plugins: ['grapesjs-preset-webpage', 'grapesjs-blocks-basic'],
            pluginsOpts: {
                'grapesjs-preset-webpage': { modalImportTitle: 'HTML importieren', showStylesOnChange: true }
            },
            canvas: {
                styles: [
                    'https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap',
                    SITE + 'css/styles.css'
                ]
            },
            assetManager: {
                upload: '/api/upload',
                uploadName: 'file',
                autoAdd: true
            },
            deviceManager: {
                devices: [
                    { id: 'desktop', name: 'Desktop', width: '' },
                    { id: 'tablet', name: 'Tablet', width: '768px', widthMedia: '992px' },
                    { id: 'mobile', name: 'Handy', width: '375px', widthMedia: '575px' }
                ]
            }
        });

        // Eigene VZG-Blöcke
        const bm = editor.BlockManager;
        bm.add('vzg-hero', {
            label: 'Hero / Kopfbereich',
            category: 'VZG',
            content: `<section class="page-section clearfix"><div class="container"><div class="row"><div class="col-lg-6"><h1 class="display-4">Ihr Partner für günstigste Energie</h1><p class="lead">Text hier bearbeiten.</p><a class="btn btn-primary btn-xl" href="termin.html">Termin buchen</a></div></div></div></section>`
        });
        bm.add('vzg-features', {
            label: 'Drei Karten',
            category: 'VZG',
            content: `<section class="page-section"><div class="container"><div class="row g-4"><div class="col-md-4"><div class="card h-100 p-4"><h3>Leistung 1</h3><p>Beschreibung.</p></div></div><div class="col-md-4"><div class="card h-100 p-4"><h3>Leistung 2</h3><p>Beschreibung.</p></div></div><div class="col-md-4"><div class="card h-100 p-4"><h3>Leistung 3</h3><p>Beschreibung.</p></div></div></div></div></section>`
        });
        bm.add('vzg-cta', {
            label: 'Call-to-Action',
            category: 'VZG',
            content: `<section class="page-section bg-primary text-white"><div class="container text-center"><h2>Jetzt Energie sparen</h2><p class="mb-4">Kostenlose Erstberatung anfordern.</p><a class="btn btn-light btn-xl" href="termin.html">Termin buchen</a></div></section>`
        });
        bm.add('vzg-pricing', {
            label: 'Preistabelle',
            category: 'VZG',
            content: `<section class="page-section"><div class="container"><h2 class="text-center mb-4">Preise</h2><table class="table"><thead><tr><th>Leistung</th><th>Preis</th></tr></thead><tbody><tr><td>Erstberatung Energie</td><td>49 €</td></tr><tr><td>Tarif-Check &amp; Optimierung</td><td>99 €</td></tr><tr><td>Wechsel-Service</td><td>149 €</td></tr></tbody></table></div></section>`
        });

        // --- Laden / Speichern ---
        async function loadPages() {
            const res = await fetch('/api/pages');
            const { pages } = await res.json();
            const sel = document.getElementById('page-select');
            sel.innerHTML = pages.map((p) => `<option value="${p.slug}">${p.title}${p.edited ? ' ✎' : ''}</option>`).join('');
            sel.addEventListener('change', () => loadPage(sel.value));
            if (pages[0]) await loadPage(pages[0].slug);
        }

        async function loadPage(slug) {
            setStatus('Lade ' + slug + ' …');
            const res = await fetch('/api/pages/' + slug);
            const data = await res.json();
            if (!res.ok) { alert(data.message || 'Fehler beim Laden'); setStatus('Fehler'); return; }

            currentSlug = slug;
            const doc = new DOMParser().parseFromString(data.html, 'text/html');
            currentHead = doc.head.innerHTML;

            const scripts = Array.from(doc.body.querySelectorAll('script'));
            bodyScripts = scripts.map((s) => s.outerHTML);
            scripts.forEach((s) => s.remove());

            let body = doc.body.innerHTML;
            editor.setComponents(toCanvas(body));
            editor.setStyle('');
            editor.UndoManager.clear();
            setStatus(`Geladen: ${slug} (${data.source === 'content' ? 'gespeicherte Version' : 'aus Build'})`);
        }

        async function savePage() {
            if (!currentSlug) return;
            setStatus('Speichere …');
            const body = fromCanvas(editor.getHtml());
            const css = editor.getCss() || '';
            const styleBlock = css.trim() ? `\n<style id="vzg-editor-styles">\n${css}\n</style>\n` : '';
            const full = `<!DOCTYPE html>\n<html lang="de">\n<head>\n${currentHead}${styleBlock}</head>\n<body>\n${body}\n${bodyScripts.join('\n')}\n</body>\n</html>\n`;

            const res = await fetch('/api/pages/' + currentSlug, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: full })
            });
            const out = await res.json();
            setStatus(out.message || (out.ok ? 'Gespeichert' : 'Fehler'));
            if (out.ok) refreshEditedMarks();
        }

        async function refreshEditedMarks() {
            const res = await fetch('/api/pages');
            const { pages } = await res.json();
            const sel = document.getElementById('page-select');
            const cur = sel.value;
            sel.innerHTML = pages.map((p) => `<option value="${p.slug}">${p.title}${p.edited ? ' ✎' : ''}</option>`).join('');
            sel.value = cur;
        }

        // --- Buttons ---
        document.getElementById('btn-save').addEventListener('click', savePage);
        document.getElementById('btn-undo').addEventListener('click', () => editor.UndoManager.undo());
        document.getElementById('btn-redo').addEventListener('click', () => editor.UndoManager.redo());
        document.getElementById('btn-preview').addEventListener('click', () => editor.runCommand('preview'));

        // --- Code-Ansicht ---
        const modal = document.getElementById('code-modal');
        document.getElementById('btn-code').addEventListener('click', () => {
            document.getElementById('code-html').value = fromCanvas(editor.getHtml());
            document.getElementById('code-css').value = editor.getCss() || '';
            modal.style.display = 'block';
        });
        document.getElementById('code-close').addEventListener('click', () => (modal.style.display = 'none'));
        document.getElementById('code-apply').addEventListener('click', () => {
            editor.setComponents(toCanvas(document.getElementById('code-html').value));
            modal.style.display = 'none';
            setStatus('HTML übernommen – jetzt speichern.');
        });

        // --- Auf Original (Pug-Template) zurücksetzen ---
        document.getElementById('btn-reset').addEventListener('click', async () => {
            if (!currentSlug) return;
            if (!confirm('Gespeicherte Änderungen dieser Seite verwerfen und das Original wiederherstellen?')) return;
            setStatus('Setze zurück …');
            const res = await fetch('/api/pages/' + currentSlug, { method: 'DELETE' });
            const out = await res.json();
            setStatus(out.message || 'Zurückgesetzt');
            await loadPage(currentSlug);
            refreshEditedMarks();
        });

        // --- Nach GitHub veröffentlichen ---
        document.getElementById('btn-publish').addEventListener('click', async () => {
            if (!confirm('Aktuelle Änderungen nach GitHub veröffentlichen? Die Live-Seite wird danach automatisch neu gebaut.')) return;
            setStatus('Veröffentliche …');
            const btn = document.getElementById('btn-publish');
            btn.disabled = true;
            try {
                const res = await fetch('/api/publish', { method: 'POST' });
                const out = await res.json();
                setStatus(out.message || (out.ok ? 'Veröffentlicht' : 'Fehler'));
                if (!out.ok) alert(out.message + (out.detail ? '\n\n' + out.detail : ''));
            } catch (e) {
                setStatus('Fehler beim Veröffentlichen');
                alert(String(e));
            } finally {
                btn.disabled = false;
            }
        });

        // Tastenkürzel
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); savePage(); }
        });

        loadPages();
    </script>
</body>
</html>
